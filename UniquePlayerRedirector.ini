; UniquePlayerRedirector 0.2.6 hands/face hardening test
; Runtime-only, ESP-less player asset isolation.
;
; Deliberately does NOT touch race or animation/behavior data.

[General]
EnableSkinMeshes=true
EnableSkinTextures=true
EnableFirstPerson=true

; Player face base TXST only. Head parts, head mesh, TRI/morph data and sculpt data
; are never replaced by this plugin.
EnableFaceTextures=true

; If a winning body/hand ARMA or TXST comes from a custom folder, try the same
; filename under the dedicated player folder. This is especially useful for NakedHands.
SkinMeshBasenameFallback=true
SkinTextureBasenameFallback=true

; If a custom face TXST uses a non-vanilla folder, try the same DDS filename under
; PlayerHumanFemale/PlayerHumanMale. The redirect only occurs when the loose target
; file exists (with RequireLooseTarget=true).
FaceBasenameFallback=true

; Every individual redirect occurs only when its player-only loose target exists.
; Missing files therefore fall back to the upstream/vanilla/modded asset.
RequireLooseTarget=true

; Rebuild player 3D after initial load/new game when a redirect was actually applied.
Reset3DOnApply=true

; Temporarily restore upstream skin/face TXST pointers while a save is serialized,
; then reattach the runtime-only pointers immediately afterward.
SaveHygiene=true

; After menus close, cheaply check whether another runtime mod changed the player skin
; or face TXST. If so, wrap the new winner instead of forcing a stale source.
ReapplyAfterMenuClose=true

VerboseLog=true

[Paths]
MeshFrom=Actors\Character\CharacterAssets\
MeshTo=Actors\Character\PlayerCharacterAssets\
FemaleTextureFrom=Actors\Character\BaseHumanFemale\
FemaleTextureTo=Actors\Character\PlayerHumanFemale\
MaleTextureFrom=Actors\Character\BaseHumanMale\
MaleTextureTo=Actors\Character\PlayerHumanMale\
